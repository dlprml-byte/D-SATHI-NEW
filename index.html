<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPAL SATHI</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5fc;
 color:#252b45;
}
header{
 background:linear-gradient(120deg,#172554,#5145a5,#a855f7);
 color:white;
 padding:25px 18px 35px;
 border-radius:0 0 30px 30px;
}
.brand{font-size:25px;font-weight:bold}
.tagline{font-size:13px;margin-top:7px}
.hero{margin-top:28px}
.hero h2{font-size:25px;margin:0 0 8px}
.hero p{font-size:14px;opacity:.9}
.container{max-width:650px;margin:auto;padding:16px}
.box{
 background:white;padding:20px;
 border-radius:18px;margin:15px 0;
 box-shadow:0 5px 20px #0000000c;
}
input{
 width:100%;padding:14px;margin:8px 0;
 border:1px solid #ddd;border-radius:10px;
 font-size:16px;
}
button{
 border:0;padding:13px;border-radius:10px;
 background:#5145a5;color:white;
 font-size:15px;cursor:pointer;
}
.full{width:100%;margin-top:8px}
#message{color:#d71920;font-size:14px}
#app{display:none}
.section-title{margin:25px 2px 14px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:13px;
}
.card{
 background:white;padding:18px 12px;
 border-radius:17px;text-align:center;
 box-shadow:0 4px 15px #0000000b;
}
.icon{font-size:34px}
.card h3{font-size:16px;margin:10px 0 5px}
.card p{font-size:12px;color:#777;margin:0 0 12px}
.card a{
 display:block;text-decoration:none;
 background:#5145a5;color:white;
 padding:10px;border-radius:9px;
 font-size:14px;
}
.facebook a{background:#1877f2}
.tiktok a{background:#111}
.youtube a{background:#e62117}
.news a{background:#168c70}
.patro a{background:#df8a26}
.health a{background:#168ac2}
.games a{background:#7c4dba}
.footer{
 text-align:center;padding:25px;
 color:#777;font-size:13px;
}
</style>
</head>

<body>

<header>
 <div class="brand">🇳🇵 NEPAL SATHI</div>
 <div class="tagline">Connect Nepal. Discover More.</div>

 <div class="hero">
  <h2>नमस्कार! 🙏</h2
