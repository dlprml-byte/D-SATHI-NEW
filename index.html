<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEPAL SATHI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5fb;
 color:#252943;
}
header{
 background:linear-gradient(135deg,#14213d,#5145a5,#9b59b6);
 color:white;
 padding:25px 18px 35px;
 border-radius:0 0 25px 25px;
}
.logo{font-size:26px;font-weight:bold}
.tagline{font-size:13px;margin-top:7px}
.container{max-width:700px;margin:auto;padding:16px}
.login,.card{
 background:white;
 padding:18px;
 margin:15px 0;
 border-radius:16px;
 box-shadow:0 4px 15px #00000010;
}
input{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:16px;
}
button{
 width:100%;
 padding:13px;
 border:0;
 border-radius:9px;
 background:#5145a5;
 color:white;
 margin-top:8px;
 font-size:15px;
}
#message{font-size:14px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.card{text-align:center;padding:15px 10px}
.icon{font-size:32px}
.card h3{font-size:16px}
.card a{
 display:block;
 background:#5145a5;
 color:white;
 text-decoration:none;
 padding:10px;
 border-radius:9px;
}
.footer{text-align:center;padding:25px;color:#777}
</style>
</head>

<body>

<header>
 <div class="logo">🇳🇵 NEPAL SATHI</div>
 <div class="tagline">Connect Nepal. Discover More.</div>
 <h2>नमस्कार 🙏</h2>
 <p>नेपालको आफ्नै डिजिटल साथी</p>
</header>

<main class="container">

<div class="login">
 <h2>👤 Login / Register</h2>

 <input id="email" type="email"
 placeholder="Email Address">

 <input id="password" type="password"
 placeholder="Password (कम्तीमा ६ अक्षर)">

 <button onclick="register()">Create New Account</button>
 <button onclick="login()">Login</button>
 <button onclick="resetPassword()">Forgot Password?</button>
 <button onclick="logout()" style="background:#555">Logout</button>

 <p id="message">आफ्नो खाता प्रयोग गर्नुहोस्।</p>
</div>

<h2>🌐 Social Media</h2>

<div class="grid">

<div class="card">
 <div class="icon">📘</div>
 <h3>Facebook</h3>
 <a href="https://www.facebook.com/">Open</a>
</div>
